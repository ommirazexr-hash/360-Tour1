version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-virtualtour}
      POSTGRES_USER: ${DB_USER:-vtadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vtadmin_dev_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - vt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vtadmin} -d ${DB_NAME:-virtualtour}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vt_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-vtadmin}:${DB_PASSWORD:-vtadmin_dev_2026}@db:5432/${DB_NAME:-virtualtour}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-524288000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    networks:
      - vt_network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vt_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_UPLOAD_URL: ${NEXT_PUBLIC_UPLOAD_URL:-http://localhost:4000/uploads}
    ports:
      - "3000:3000"
    networks:
      - vt_network

  nginx:
    image: nginx:1.25-alpine
    container_name: vt_nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    networks:
      - vt_network

volumes:
  pg_data:
    driver: local
  uploads:
    driver: local

networks:
  vt_network:
    driver: bridge
